<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Gestión de Presupuestos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css?v=18">
</head>
<body>
    <div id="app">
        <!-- Notificaciones flotantes -->
        <div id="toast-container"></div>

        <!-- Pantalla de Login -->
        <section id="login-view" class="view active glass-panel" style="max-width: 450px;">
            <div class="login-header" style="text-align: center;">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 20px;">
                    <img src="logo_sg_montajes.png" alt="SG MONTAJES Logo" style="width: 160px; height: auto; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));">
                    <div style="font-size: 22px; font-weight: 800; color: white; letter-spacing: 1px; line-height: 1.2;">
                        SG <span style="font-weight: 400; color: var(--warning); letter-spacing: 1.5px;">MONTAJES</span>
                    </div>
                </div>
                <h3 style="margin-top: 10px; color: var(--primary); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Gestión de Presupuestos</h3>
                <div id="login-quote" class="login-quote" style="margin-top: 10px;"></div>
            </div>
            <form id="login-form" onsubmit="event.preventDefault(); window.ejecutarLoginDirecto(event);">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Ingrese su usuario" onkeydown="if(event.key === 'Enter') { event.preventDefault(); window.ejecutarLoginDirecto(event); }">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key === 'Enter') { event.preventDefault(); window.ejecutarLoginDirecto(event); }">
                </div>
                <button type="button" class="btn btn-primary" onclick="window.ejecutarLoginDirecto(event)" style="width: 100%; font-weight: bold; cursor: pointer; position: relative; z-index: 10;">Ingresar</button>
            </form>
        </section>

        <!-- Contenedor Principal (Dashboard) -->
        <section id="main-view" class="view">
            <header class="glass-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button id="sidebar-toggle" class="btn btn-sm" title="Alternar Menú">☰</button>
                    <!-- Botón Volver a la Acción Anterior -->
                    <button id="btn-global-volver" class="btn btn-sm btn-nav-volver" onclick="volverAccionAnterior()" title="Volver a la acción o pantalla anterior (Alt + ←)" style="display: inline-flex; align-items: center; gap: 6px; background: rgba(15, 23, 42, 0.7); border: 1.5px solid rgba(56, 189, 248, 0.5); color: #38bdf8; font-weight: 700; font-size: 12px; height: 32px; padding: 0 12px; border-radius: 6px; transition: all 0.2s ease; cursor: pointer;">
                        <i class="fa-solid fa-arrow-left"></i> <span>Volver</span>
                    </button>
                    <div class="logo" style="display: flex; align-items: center; gap: 10px;">
                        <img src="logo_sg_montajes.png" alt="SG MONTAJES Logo" style="width: auto; height: 28px; object-fit: contain;">
                        <span style="font-weight: 800; font-size: 14px; letter-spacing: 0.5px;">SG <span style="font-weight: 400; color: var(--warning);">MONTAJES</span></span>
                    </div>
                </div>
                <div id="motivational-quote" class="motivational-quote"></div>
                <div class="user-info" style="position: relative; display: flex; align-items: center; gap: 15px;">
                    <!-- Campanita de notificaciones -->
                    <div id="notification-bell" style="position: relative; cursor: pointer; padding: 5px; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
                        <i class="fas fa-bell" style="font-size: 26px; color: #ffffff; text-shadow: 0 2px 8px rgba(0,0,0,0.6);"></i>
                        <span id="notification-badge" style="display: none; position: absolute; top: -2px; right: -4px; background: #ff3b30; color: white; font-size: 12px; font-weight: 800; padding: 3px 7px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.6); border: 2px solid var(--glass-bg);">0</span>
                    </div>
                    <!-- Dropdown de Notificaciones -->
                    <div id="notification-dropdown" class="glass-card" style="display: none; position: absolute; top: 45px; right: 80px; width: 300px; max-height: 400px; overflow-y: auto; z-index: 1000; padding: 10px;">
                        <h5 style="margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px;">Notificaciones</h5>
                        <div id="notification-list">
                            <!-- Notificaciones dinámicas -->
                        </div>
                    </div>
                    
                    <span id="current-user-name">Usuario</span>
                    <span id="current-user-role" class="badge">Rol</span>
                    <button id="logout-btn" class="btn btn-secondary btn-sm">Salir</button>
                </div>
            </header>

            <div class="dashboard-layout">
                <aside class="glass-sidebar" id="sidebar-menu">
                    <!-- Menú dinámico según el rol -->
                </aside>

                <main class="glass-content" id="main-content">
                    <!-- Vistas dinámicas se renderizan aquí -->
                </main>
            </div>
        </section>
    </div>

    <!-- Templates para las vistas -->
    
    <!-- Template: Vista de Administración de Usuarios -->
    <!-- Template: Vista de Configuración (Usuarios y Sistema) -->
    <template id="tpl-admin">
        <div class="admin-panel" style="max-width: 1000px; margin: 0 auto;">
            <div class="view-header" style="margin-bottom: 20px;">
                <h3 style="display: flex; align-items: center; gap: 10px; font-size: 22px; color: var(--primary);">⚙️ Configuración del Sistema</h3>
                <div style="background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.3); padding: 12px 16px; border-radius: 8px; margin-top: 12px; color: var(--text-main); font-size: 13px;">
                    💡 Administre los usuarios, credenciales de acceso y defina exactamente qué módulos y permisos puede ver cada perfil en el sistema.
                </div>
            </div>

            <!-- Solapas Principales Superiores: USUARIOS y SISTEMA -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 8px;">
                <button type="button" id="main-tab-btn-usuarios" class="btn active" onclick="switchConfigMainTab('usuarios')" style="font-size: 15px; font-weight: 700; padding: 10px 24px; border-radius: 8px; background: #0284c7; color: white; border: none; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s;">
                    <i class="fa-solid fa-users"></i> 1. Usuarios
                </button>
                <button type="button" id="main-tab-btn-sistema" class="btn" onclick="switchConfigMainTab('sistema')" style="font-size: 15px; font-weight: 700; padding: 10px 24px; border-radius: 8px; background: rgba(30, 41, 59, 0.6); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s;">
                    <i class="fa-solid fa-sliders"></i> 2. Sistema y Permisos
                </button>
            </div>

            <!-- ================= SECCIÓN 1: USUARIOS ================= -->
            <div id="config-section-usuarios" class="glass-card" style="padding: 0; overflow: hidden; display: block;">
                <!-- Subtabs de Usuarios -->
                <div style="display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.25);">
                    <button type="button" class="admin-tab active" onclick="switchAdminTab('tab-create')" style="background: none; border: none; color: var(--text-main); padding: 14px 20px; cursor: pointer; font-weight: 600; font-size: 13px; border-bottom: 2px solid var(--primary); transition: all 0.3s;">
                        ✨ Crear Credencial
                    </button>
                    <button type="button" class="admin-tab" onclick="switchAdminTab('tab-edit')" style="background: none; border: none; color: var(--text-muted); padding: 14px 20px; cursor: pointer; font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.3s;">
                        ✏️ Modificar Accesos
                    </button>
                    <button type="button" class="admin-tab" onclick="switchAdminTab('tab-delete')" style="background: none; border: none; color: var(--text-muted); padding: 14px 20px; cursor: pointer; font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.3s;">
                        ⛔ Bloquear / Baja
                    </button>
                    <button type="button" class="admin-tab" onclick="switchAdminTab('tab-user-list')" style="background: none; border: none; color: var(--text-muted); padding: 14px 20px; cursor: pointer; font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.3s;">
                        📋 Lista de Usuarios
                    </button>
                </div>

                <div style="padding: 25px;">
                    <!-- TAB 1: CREAR CREDENCIAL -->
                    <div id="tab-create" class="admin-tab-content" style="display: block; animation: fadeIn 0.3s ease-out;">
                        <form id="create-user-form">
                            <div class="form-row" style="margin-bottom: 20px;">
                                <div class="form-group">
                                    <label style="color: var(--text-muted); font-size: 12px; margin-bottom: 8px;">Usuario (Nombre de acceso corto)</label>
                                    <input type="text" id="new-username" required placeholder="Ej: jgomez" style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 12px; height: auto;">
                                </div>
                                <div class="form-group">
                                    <label style="color: var(--text-muted); font-size: 12px; margin-bottom: 8px;">Email Corporativo</label>
                                    <input type="email" id="new-email" required placeholder="ejemplo@sgmontajes.com.ar" style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 12px; height: auto;">
                                </div>
                            </div>
                            <div class="form-row" style="margin-bottom: 20px;">
                                <div class="form-group" style="flex: 1;">
                                    <label style="color: var(--text-muted); font-size: 12px; margin-bottom: 8px;">Contraseña Temporal</label>
                                    <div style="position: relative; display: flex; align-items: center;">
                                        <input type="password" id="new-password" required placeholder="••••••••" style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 12px; height: auto; width: 100%; padding-right: 40px;">
                                        <button type="button" onclick="togglePassword('new-password', this)" style="position: absolute; right: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px;">👁️</button>
                                    </div>
                                </div>
                                <div class="form-group" style="flex: 1;">
                                    <label style="color: var(--text-muted); font-size: 12px; margin-bottom: 8px;">Rubro Predeterminado (Ingreso Directo)</label>
                                    <select id="new-rubro" style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 12px; height: 42px; width: 100%; color: white; border-radius: 6px; cursor: pointer;">
                                        <option value="Eléctrico">⚡ Presupuesto Eléctrico</option>
                                        <option value="Mecánico">⚙️ Presupuesto Mecánico</option>
                                    </select>
                                </div>
                            </div>

                            <div style="text-align: right; margin-top: 25px;">
                                <button type="submit" class="btn btn-primary" style="padding: 10px 25px; font-size: 14px; font-weight: 700;">✨ Crear Credencial</button>
                            </div>
                        </form>
                    </div>

                    <!-- TAB 2: MODIFICAR ACCESOS -->
                    <div id="tab-edit" class="admin-tab-content" style="display: none; animation: fadeIn 0.3s ease-out;">
                        <h3 style="margin-bottom: 20px; font-size: 18px;">Auditoría y Edición de Accesos</h3>
                        <form id="edit-user-form">
                            <div class="form-group" style="margin-bottom: 20px;">
                                <label style="color: var(--text-main); font-size: 13px; font-weight: bold; margin-bottom: 8px;">Seleccionar Empleado a Modificar</label>
                                <select id="edit-user-select" required style="background: #ffffff; color: #000; border: none; padding: 12px; font-size: 14px; height: 45px; border-radius: 6px;">
                                    <option value="">Seleccione un empleado...</option>
                                </select>
                            </div>

                            <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                                <div class="form-row" style="margin-bottom: 20px;">
                                    <div class="form-group">
                                        <label style="color: var(--text-muted); font-size: 12px; margin-bottom: 8px;">Usuario (Nombre)</label>
                                        <input type="text" id="edit-username" required style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 12px; height: auto;">
                                    </div>
                                    <div class="form-group">
                                        <label style="color: var(--text-muted); font-size: 12px; margin-bottom: 8px;">Email Corporativo</label>
                                        <input type="email" id="edit-email" required style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 12px; height: auto;">
                                    </div>
                                </div>
                                <div class="form-row" style="margin-bottom: 20px;">
                                    <div class="form-group" style="flex: 1;">
                                        <label style="color: var(--text-muted); font-size: 12px; margin-bottom: 8px;">Contraseña</label>
                                        <div style="position: relative; display: flex; align-items: center;">
                                            <input type="password" id="edit-password" required style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 12px; height: auto; width: 100%; padding-right: 40px;">
                                            <button type="button" onclick="togglePassword('edit-password', this)" style="position: absolute; right: 10px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px;">👁️</button>
                                        </div>
                                    </div>
                                    <div class="form-group" style="flex: 1;">
                                        <label style="color: var(--text-muted); font-size: 12px; margin-bottom: 8px;">Rubro Predeterminado (Ingreso Directo)</label>
                                        <select id="edit-rubro" style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 12px; height: 42px; width: 100%; color: white; border-radius: 6px; cursor: pointer;">
                                            <option value="Eléctrico">⚡ Presupuesto Eléctrico</option>
                                            <option value="Mecánico">⚙️ Presupuesto Mecánico</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div style="text-align: right; margin-top: 25px;">
                                    <button type="submit" class="btn btn-primary" style="padding: 10px 25px; font-size: 14px; font-weight: 700;">💾 Guardar Cambios</button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- TAB 3: BAJAS -->
                    <div id="tab-delete" class="admin-tab-content" style="display: none; animation: fadeIn 0.3s ease-out;">
                        <h3 style="margin-bottom: 20px; font-size: 18px;">Congelamiento y Baja Definitiva</h3>
                        
                        <div class="form-group" style="margin-bottom: 20px;">
                            <label style="color: var(--text-main); font-size: 13px; font-weight: bold; margin-bottom: 8px;">Seleccionar Empleado</label>
                            <select id="delete-user-select" style="background: #ffffff; color: #000; border: none; padding: 12px; font-size: 14px; height: 45px; border-radius: 6px; width: 100%;">
                                <option value="">Seleccione un empleado...</option>
                            </select>
                        </div>

                        <div id="delete-user-warning" style="display: none; background: rgba(220, 53, 69, 0.2); border: 1px solid rgba(220, 53, 69, 0.4); padding: 16px; border-radius: 8px; margin-bottom: 20px; color: #ffcccc; font-weight: bold; font-size: 14px;">
                            ⚠️ ATENCIÓN: Estás a punto de alterar el acceso de <span id="delete-user-name">...</span>.
                        </div>

                        <p style="font-size: 13px; color: var(--text-main); margin-bottom: 20px; line-height: 1.5;">
                            Podés decidir quitarle todos los permisos (Congelar la cuenta para mantener el historial) o borrar por completo el registro.
                        </p>
                        
                        <div style="display: flex; gap: 15px;">
                            <button id="btn-freeze-user" type="button" class="btn" style="flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0.5; pointer-events: none;">
                                ⛔ Congelar Cuenta
                            </button>
                            <button id="btn-delete-user" type="button" class="btn btn-danger" style="flex: 1; background: rgba(220, 53, 69, 0.8); border: 1px solid rgba(220, 53, 69, 1); color: white; padding: 12px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0.5; pointer-events: none;">
                                🗑️ Eliminar Usuario
                            </button>
                        </div>
                    </div>

                    <!-- TAB 4: LISTA DE USUARIOS -->
                    <div id="tab-user-list" class="admin-tab-content" style="display: none; animation: fadeIn 0.3s ease-out;">
                        <h3 style="margin-bottom: 15px; font-size: 18px;">Usuarios Registrados en el Sistema</h3>
                        <div style="overflow-x: auto; border: 1px solid var(--glass-border); border-radius: 8px;">
                            <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                                <thead style="background: rgba(15, 23, 42, 0.9); color: var(--text-muted);">
                                    <tr>
                                        <th style="padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--glass-border);">Usuario</th>
                                        <th style="padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--glass-border);">Email Corporativo</th>
                                        <th style="padding: 10px 14px; text-align: center; border-bottom: 1px solid var(--glass-border);">Rubro Inicial</th>
                                        <th style="padding: 10px 14px; text-align: center; border-bottom: 1px solid var(--glass-border);">Estado de Cuenta</th>
                                    </tr>
                                </thead>
                                <tbody id="config-users-table-tbody">
                                    <!-- Dinámico -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================= SECCIÓN 2: SISTEMA (PERMISOS Y VISIBILIDAD) ================= -->
            <div id="config-section-sistema" class="glass-card" style="padding: 25px; display: none;">
                <div style="margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
                    <h4 style="margin: 0 0 6px 0; color: #38bdf8; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-eye"></i> Matriz de Visibilidad y Permisos de Módulos
                    </h4>
                    <p style="margin: 0; font-size: 13px; color: var(--text-muted);">
                        Seleccione el usuario para definir con precisión qué pantallas y herramientas puede ver y operar en el sistema.
                    </p>
                </div>

                <!-- Banner de Confirmación de Guardado con Éxito -->
                <div id="permisos-save-feedback-banner" style="display: none; background: rgba(16, 185, 129, 0.18); border: 1.5px solid #10b981; border-radius: 10px; padding: 14px 20px; margin-bottom: 20px; align-items: center; justify-content: space-between; gap: 12px; animation: fadeIn 0.3s ease;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="font-size: 24px; color: #10b981;">✅</span>
                        <div>
                            <strong style="color: #6ee7b7; font-size: 15px; display: block;">¡Permisos guardados con éxito!</strong>
                            <span id="permisos-save-feedback-text" style="color: rgba(255,255,255,0.85); font-size: 12px;">Los módulos y parámetros se actualizaron correctamente para este usuario.</span>
                        </div>
                    </div>
                    <button type="button" onclick="document.getElementById('permisos-save-feedback-banner').style.display='none'" style="background: transparent; border: none; color: #6ee7b7; font-size: 18px; cursor: pointer; padding: 4px;">✕</button>
                </div>

                <!-- Selector de Usuario para configurar permisos y Resumen Activo -->
                <div style="background: rgba(15, 23, 42, 0.7); border: 1.5px solid var(--glass-border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 14px;">
                    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <span style="font-weight: 700; color: white; font-size: 14px;">👤 Seleccionar Usuario:</span>
                            <select id="config-permisos-user-select" onchange="cargarPermisosParaUsuario(this.value)" style="background: rgba(30, 41, 59, 0.95); color: #38bdf8; border: 1.5px solid #0284c7; padding: 6px 14px; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; min-width: 220px;">
                                <!-- Opciones cargadas dinámicamente -->
                            </select>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button type="button" class="btn btn-sm" onclick="seleccionarTodosPermisos(true)" style="background: rgba(2,132,199,0.2); color: #38bdf8; border: 1px solid #0284c7; font-weight: 700; font-size: 12px; padding: 6px 14px; border-radius: 6px; cursor: pointer;">
                                <i class="fa-solid fa-check-double"></i> Marcar Todos
                            </button>
                            <button type="button" class="btn btn-sm" onclick="seleccionarTodosPermisos(false)" style="background: rgba(244,63,94,0.15); color: #fda4af; border: 1px solid #f43f5e; font-weight: 700; font-size: 12px; padding: 6px 14px; border-radius: 6px; cursor: pointer;">
                                <i class="fa-solid fa-ban"></i> Desmarcar Todos
                            </button>
                        </div>
                    </div>

                    <!-- Panel de Información y Parámetros del Usuario Seleccionado -->
                    <div id="config-user-params-summary" style="background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                        <div style="display: flex; align-items: center; gap: 14px; font-size: 12px;">
                            <span style="color: var(--text-muted);">Usuario: <strong id="summary-perm-username" style="color: #38bdf8;">mel</strong></span>
                            <span style="color: var(--text-muted);">Rol: <strong id="summary-perm-role" style="color: #ffffff;">Administrador</strong></span>
                            <span style="color: var(--text-muted);">Rubro Inicial: <strong id="summary-perm-rubro" style="color: #fde047;">⚡ Eléctrico</strong></span>
                            <span style="color: var(--text-muted);">Email: <strong id="summary-perm-email" style="color: #ffffff;">-</strong></span>
                        </div>
                        <div id="summary-perm-count-badge" style="background: #10b981; color: white; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px;">
                            ⚡ 6 de 6 Módulos Habilitados
                        </div>
                    </div>

                        <button type="button" class="btn btn-sm btn-outline" onclick="setAvancePorcentajeRapido(40)" style="font-weight: 700; background: rgba(45,212,191,0.1); border-color: #2dd4bf; color: #2dd4bf;">+40%</button>
                        <button type="button" class="btn btn-sm btn-outline" onclick="setAvancePorcentajeRapido(50)" style="font-weight: 700; background: rgba(45,212,191,0.1); border-color: #2dd4bf; color: #2dd4bf;">+50%</button>
                        <button type="button" class="btn btn-sm btn-outline" onclick="setAvancePorcentajeRapido('restante')" style="font-weight: 700; background: rgba(16,185,129,0.2); border-color: #10b981; color: #6ee7b7;">Completar Saldo (100%)</button>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="font-weight: bold; color: white;">% de Avance Actual *</label>
                        <div style="position: relative;">
                            <input type="number" id="avance-input-pct" min="1" max="100" step="1" placeholder="Ej: 30" style="font-size: 16px; font-weight: 800; color: #2dd4bf; padding-right: 30px;" oninput="onAvancePorcentajeInput(this.value)">
                            <span style="position: absolute; right: 12px; top: 10px; font-weight: 800; color: #2dd4bf;">%</span>
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="font-weight: bold; color: #34d399;">Monto Calculado a Facturar ($) *</label>
                        <input type="text" id="avance-input-monto-display" readonly style="font-size: 16px; font-weight: 800; color: #34d399; background: rgba(15, 23, 42, 0.9); font-family: monospace; border: 1.5px solid #059669;" value="$0,00">
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="font-weight: bold; color: white;">Fecha del Hito *</label>
                        <input type="date" id="avance-input-fecha" style="font-size: 13px;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="color: var(--text-muted); font-size: 12px;">Nro. Certificado / Remito / OC:</label>
                        <input type="text" id="avance-input-nro-doc" placeholder="Ej: Certificado Nº 1 / OC-51240" style="font-size: 13px;">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label style="color: var(--text-muted); font-size: 12px;">Detalle / Etapa del Avance:</label>
                        <input type="text" id="avance-input-detalle" placeholder="Ej: Avance 30% ingeniería y montaje inicial en planta" style="font-size: 13px;">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="guardarAvanceObra()" style="background-color: #0d9488; border-color: #0d9488; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-paper-plane"></i> Registrar Avance y Notificar Facturación
                    </button>
                </div>
            </div>

            <!-- Historial de Avances Cargados -->
            <div>
                <h5 style="margin: 0 0 10px 0; color: white; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-list-check"></i> Historial de Certificados y Avances de este Presupuesto
                </h5>
                <div style="max-height: 180px; overflow-y: auto; border: 1px solid var(--glass-border); border-radius: 8px;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 12px; text-align: left;">
                        <thead style="background: rgba(15, 23, 42, 0.9); color: var(--text-muted); position: sticky; top: 0;">
                            <tr>
                                <th style="padding: 8px 12px; border-bottom: 1px solid var(--glass-border);">Fecha</th>
                                <th style="padding: 8px 12px; border-bottom: 1px solid var(--glass-border);">% Hito</th>
                                <th style="padding: 8px 12px; border-bottom: 1px solid var(--glass-border);">Monto a Facturar</th>
                                <th style="padding: 8px 12px; border-bottom: 1px solid var(--glass-border);">Doc / Certificado</th>
                                <th style="padding: 8px 12px; border-bottom: 1px solid var(--glass-border);">Detalle</th>
                                <th style="padding: 8px 12px; border-bottom: 1px solid var(--glass-border); text-align: center;">Comprobante</th>
                            </tr>
                        </thead>
                        <tbody id="avance-historial-tbody">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <!-- Template: Modal Comprobante / Certificado de Avance de Obra -->
    <template id="tpl-modal-comprobante-avance">
        <div class="modal-content" style="max-width: 650px; width: 95%; background: #ffffff; color: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
            
            <!-- Barra Superior de Acciones (No se imprime) -->
            <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px;">
                <span style="font-size: 13px; font-weight: 700; color: #0f766e; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-file-circle-check"></i> Comprobante de Avance de Obra
                </span>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn btn-sm" onclick="imprimirComprobanteAvance()" style="background: #0284c7; color: white; border: none; font-weight: 700; padding: 6px 14px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                        <i class="fa-solid fa-print"></i> Imprimir / PDF
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="closeModal()" style="background: #e2e8f0; color: #334155; border: 1px solid #cbd5e1; font-weight: 700; padding: 6px 14px; border-radius: 6px; cursor: pointer;">
                        ✕ Cerrar
                    </button>
                </div>
            </div>

            <!-- Contenedor Imprimible del Comprobante -->
            <div id="print-comprobante-avance-area" style="border: 2px solid #0f766e; border-radius: 8px; padding: 20px; background: #ffffff;">
                
                <!-- Encabezado con Logo y Título -->
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0f766e; padding-bottom: 12px; margin-bottom: 16px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <img id="comp-avance-logo" src="logo_sg_montajes.png" alt="Logo" style="height: 36px; width: auto; object-fit: contain;">
                        <div>
                            <h3 id="comp-avance-empresa" style="margin: 0; font-size: 16px; font-weight: 900; color: #0f172a; letter-spacing: 0.5px;">SG MONTAJES SRL</h3>
                            <span style="font-size: 10.5px; color: #64748b; display: block;">Montajes Industriales & Servicios Electromecánicos</span>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <span style="background: #0f766e; color: #ffffff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 4px; display: inline-block; text-transform: uppercase; letter-spacing: 0.5px;">
                            CERTIFICADO DE AVANCE
                        </span>
                        <div style="font-size: 11px; color: #334155; margin-top: 4px; font-weight: 600;">
                            Fecha: <span id="comp-avance-fecha" style="font-weight: 800; color: #0f172a;">-</span>
                        </div>
                    </div>
                </div>

                <!-- Datos de la Obra y Presupuesto -->
                <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; font-size: 11.5px; line-height: 1.6;">
                    <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px;">
                        <div>
                            <span style="color: #64748b; font-weight: 600;">Presupuesto Ref.:</span> 
                            <strong id="comp-avance-presupuesto-id" style="color: #0284c7; font-family: monospace;">-</strong>
                        </div>
                        <div>
                            <span style="color: #64748b; font-weight: 600;">Planta:</span> 
                            <strong id="comp-avance-planta" style="color: #0f172a;">-</strong>
                        </div>
                        <div>
                            <span style="color: #64748b; font-weight: 600;">Cliente:</span> 
                            <strong id="comp-avance-cliente" style="color: #0f172a;">-</strong>
                        </div>
                        <div>
                            <span style="color: #64748b; font-weight: 600;">Orden de Compra (OC):</span> 
                            <strong id="comp-avance-nro-oc" style="color: #0f172a;">-</strong>
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <span style="color: #64748b; font-weight: 600;">Denominación del Servicio:</span> 
                            <strong id="comp-avance-denominacion" style="color: #0f172a;">-</strong>
                        </div>
                    </div>
                </div>

                <!-- Detalle del Hito Certificado -->
                <div style="margin-bottom: 16px;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 11.5px; text-align: left; border: 1px solid #cbd5e1;">
                        <thead style="background: #0f766e; color: #ffffff;">
                            <tr>
                                <th style="padding: 6px 10px; font-weight: 700;">Concepto</th>
                                <th style="padding: 6px 10px; font-weight: 700; text-align: center; width: 100px;">% Avance</th>
                                <th style="padding: 6px 10px; font-weight: 700; text-align: right; width: 140px;">Importe a Facturar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style="background: #f0fdf4; border-bottom: 1px solid #cbd5e1;">
                                <td style="padding: 8px 10px; font-weight: 700; color: #166534;">
                                    <span id="comp-avance-doc-label">Certificado de Avance Actual</span>
                                </td>
                                <td style="padding: 8px 10px; text-align: center; font-weight: 800; font-size: 13px; color: #0f766e;" id="comp-avance-pct">
                                    0%
                                </td>
                                <td style="padding: 8px 10px; text-align: right; font-family: monospace; font-weight: 800; font-size: 13px; color: #166534;" id="comp-avance-monto">
                                    $0,00
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Cuadro de Estado Financiero Acumulado -->
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; font-size: 11px; text-align: center;">
                    <div style="background: #f1f5f9; padding: 8px 6px; border-radius: 6px; border: 1px solid #e2e8f0;">
                        <span style="color: #64748b; display: block; font-weight: 600;">Total Presupuesto</span>
                        <strong id="comp-avance-total-presupuesto" style="color: #0f172a; font-family: monospace; font-size: 12px;">$0,00</strong>
                    </div>
                    <div style="background: #e6fffa; padding: 8px 6px; border-radius: 6px; border: 1px solid #99f6e4;">
                        <span style="color: #0d9488; display: block; font-weight: 600;">Acumulado a la Fecha</span>
                        <strong id="comp-avance-acumulado-display" style="color: #0f766e; font-family: monospace; font-size: 12px;">0% ($0,00)</strong>
                    </div>
                    <div style="background: #fffbeb; padding: 8px 6px; border-radius: 6px; border: 1px solid #fde68a;">
                        <span style="color: #b45309; display: block; font-weight: 600;">Saldo Pendiente</span>
                        <strong id="comp-avance-saldo-display" style="color: #b45309; font-family: monospace; font-size: 12px;">100% ($0,00)</strong>
                    </div>
                </div>

                <!-- Tareas Realizadas / Observaciones -->
                <div style="border: 1px dashed #cbd5e1; border-radius: 6px; padding: 10px 12px; margin-bottom: 20px; font-size: 11px; background: #fafafa;">
                    <strong style="color: #334155; display: block; margin-bottom: 4px;">Detalle de Trabajos y Tareas Ejecutadas:</strong>
                    <p id="comp-avance-detalle-texto" style="margin: 0; color: #475569; font-style: italic; white-space: pre-wrap;">-</p>
                </div>

                <!-- Firmas de Conformidad -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; padding-top: 10px; font-size: 11px; text-align: center;">
                    <div style="border-top: 1px solid #64748b; padding-top: 6px;">
                        <span style="color: #0f172a; font-weight: 700; display: block;">Firma y Aclaración Responsable</span>
                        <span id="comp-avance-firma-empresa" style="color: #64748b; font-size: 10px;">SG MONTAJES SRL</span>
                    </div>
                    <div style="border-top: 1px solid #64748b; padding-top: 6px;">
                        <span style="color: #0f172a; font-weight: 700; display: block;">Conformidad Inspección / Cliente</span>
                        <span id="comp-avance-firma-cliente" style="color: #64748b; font-size: 10px;">CARGILL SACI</span>
                    </div>
                </div>

            </div>
        </div>
    </template>

    <!-- Template: Modal Agregar Vista Personalizada -->
    <template id="tpl-modal-nueva-vista">
        <div class="modal-content" style="max-width: 480px; width: 95%;">
            <div class="modal-header">
                <h3 style="display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 0; color: #38bdf8;">
                    <i class="fas fa-table-columns"></i> ➕ Agregar Nueva Vista
                </h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            
            <div style="padding: 15px 0 5px 0;">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 12px; font-weight: 700; color: white; margin-bottom: 5px; display: block;">Nombre de la Vista *</label>
                    <input type="text" id="nueva-vista-nombre" class="form-control" placeholder="Ej: Agrupado por Estado, Mis Aprobados..." style="font-size: 13px;">
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 12px; font-weight: 700; color: white; margin-bottom: 5px; display: block;">Modo de Agrupación</label>
                    <select id="nueva-vista-agrupacion" class="form-control" style="font-size: 13px;">
                        <option value="">📂 Sin Agrupar (Lista estándar)</option>
                        <option value="estado">📂 Agrupar por Estado</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="font-size: 12px; font-weight: 700; color: white; margin-bottom: 5px; display: block;">Filtro de Estado por Defecto</label>
                    <select id="nueva-vista-filtro-estado" class="form-control" style="font-size: 13px;">
                        <option value="">📋 Todos los estados</option>
                        <option value="Enviado sin OC">📤 Enviado sin OC</option>
                        <option value="Aprobado sin OC">⏳ Aprobado sin OC</option>
                        <option value="Aprobado con OC">✅ Aprobado con OC</option>
                        <option value="Facturado Parcial">🧾 Facturado Parcial</option>
                        <option value="Facturado Total">💎 Facturado Total</option>
                        <option value="Rechazado">❌ Rechazado</option>
                    </select>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarNuevaVistaPersonalizada()" style="font-weight: 700;">
                        <i class="fas fa-save"></i> Guardar Vista
                    </button>
                </div>
            </div>
        </div>
    </template>
